# REFL Comparison: 300 trainers, 90% predictor accuracy, syn20 vs syn50 availability
# 
# Purpose: Compare REFL performance with 90% predictor accuracy across different
# unavailability levels (20% vs 50%) with alpha=0.1 heterogeneity
#
# REFL Gradient Policy for CIFAR-10:
# - Per original REFL paper: "we use yogi for all benchmarks except for CIFAR10"
# - CIFAR-10 uses FedAvg gradient policy (default, no post-processing)
# - No gradient_policy parameter = FedAvg (correct for CIFAR-10)
#
# Critical CIFAR-10 Hyperparameters (matching third_party/REFL):
# - Client learning rate: 0.01 (NOT 0.04 - that's too high and causes loss plateau!)
# - Batch size: 10 (NOT 32 - larger batches slow convergence)
# - stale_beta: 0.35 (REFL paper default, balances staleness vs utility)
# - stale_factor: -4 (REFL method for staleness-aware weighting)
#
# Experiment Setup:
# - 300 trainers, CIFAR-10, alpha=0.1 (non-IID)
# - Fixed 90% predictor accuracy (REFL paper setting)
# - Variable unavailability: syn_20 (20%) and syn_50 (50%)
# - aggGoal=10, batchSize=10 (REFL default for CIFAR-10)
# - Client LR=0.01 (REFL default for CIFAR-10)
# - REFL optimizer with FedAvg gradient policy (no YoGi for CIFAR-10, per REFL paper)
# - stale_beta=0.35 (REFL paper default), stale_factor=-4 (REFL method)
# - Sequential execution: each experiment runs to completion before next starts
#
# Experiments:
# 1. REFL with syn20 (20% unavailability), 90% predictor
# 2. REFL with syn50 (50% unavailability), 90% predictor
#
# Expected Results:
# - Tests REFL robustness to increasing unavailability with realistic predictor

experiments:
  - name: refl_n300_syn50_prob0.9
    description: "REFL with 90% predictor accuracy, syn50 availability, alpha=0.1 heterogeneity"
    
    trainer:
      num_trainers: 300
      start_id: 1
      dataset:
        name: cifar10
        dirichlet_alpha: 0.1
      availability:
        mode: syn_50  # 50% unavailability
      speedup_factor: 1.0
      enable_training_delays: true
      hyperparameters:
        batchSize: 10
        learningRate: 0.01
        lrDecayEnabled: true
        lrDecayFactor: 0.98
        lrDecayEpoch: 10
        minLearningRate: 0.0001
    
    aggregator:
      config_template: expt_scripts_2026/configs/refl_n300_syn50_prob0.9.json
      selector: refl_oort
      tracking_mode: oracular
      agg_goal: 10
      log_to_wandb: true
      wandb_run_name: refl_n300_syn50_prob0.9_alpha0.1
    
    execution:
      num_gpus: 8
      sleep_between_spawns: 8.0
      aggregator_warmup_time: 120
      monitoring:
        enabled: true
        check_interval_seconds: 30
        ram_warning_percent: 80.0
        ram_critical_percent: 90.0
        gpu_warning_percent: 80.0
        gpu_critical_percent: 90.0
