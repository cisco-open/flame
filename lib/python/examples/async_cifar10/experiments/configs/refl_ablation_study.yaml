# REFL Ablation Study
# Compares baseline, availability-only, staleness-only, and full REFL

experiments:
  # Baseline: No REFL features
  - name: refl_ablation_baseline
    description: "Baseline: Standard Oort + FedAvg (no REFL)"
    
    trainer:
      num_trainers: 100
      start_id: 1
      dataset:
        name: cifar10
        dirichlet_alpha: 0.1
      availability:
        mode: syn_20  # 20% unavailability
      speedup_factor: 1.0
    
    aggregator:
      config_template: expt_scripts_2026/configs/refl_config_ablation_baseline.json
      selector: oort
      tracking_mode: oracular
      agg_goal: 10
      log_to_wandb: true
      wandb_run_name: refl_ablation_baseline
    
    execution:
      num_gpus: 4
      sleep_between_spawns: 1.0
      aggregator_warmup_time: 10
  
  # Availability-only: REFL priority selection
  - name: refl_ablation_availability
    description: "REFL availability tracking + priority selection only"
    
    trainer:
      num_trainers: 100
      start_id: 1
      dataset:
        name: cifar10
        dirichlet_alpha: 0.1
      availability:
        mode: syn_20
      speedup_factor: 1.0
    
    aggregator:
      config_template: expt_scripts_2026/configs/refl_config_ablation_avail.json
      selector: refl_oort
      tracking_mode: oracular
      agg_goal: 10
      log_to_wandb: true
      wandb_run_name: refl_ablation_availability
    
    execution:
      num_gpus: 4
      sleep_between_spawns: 1.0
      aggregator_warmup_time: 10
  
  # Staleness-only: REFL staleness handling
  - name: refl_ablation_staleness
    description: "REFL staleness handling only (no priority selection)"
    
    trainer:
      num_trainers: 100
      start_id: 1
      dataset:
        name: cifar10
        dirichlet_alpha: 0.1
      availability:
        mode: syn_20
      speedup_factor: 1.0
    
    aggregator:
      config_template: expt_scripts_2026/configs/refl_config_ablation_staleness.json
      selector: oort
      tracking_mode: oracular
      agg_goal: 10
      log_to_wandb: true
      wandb_run_name: refl_ablation_staleness
    
    execution:
      num_gpus: 4
      sleep_between_spawns: 1.0
      aggregator_warmup_time: 10
  
  # Full REFL: All features enabled
  - name: refl_ablation_full
    description: "Full REFL: Availability + Staleness + Pacer + Blacklist"
    
    trainer:
      num_trainers: 100
      start_id: 1
      dataset:
        name: cifar10
        dirichlet_alpha: 0.1
      availability:
        mode: syn_20
      speedup_factor: 1.0
    
    aggregator:
      config_template: expt_scripts_2026/configs/refl_config_n300.json
      selector: refl_oort
      tracking_mode: oracular
      agg_goal: 10
      log_to_wandb: true
      wandb_run_name: refl_ablation_full
    
    execution:
      num_gpus: 4
      sleep_between_spawns: 1.0
      aggregator_warmup_time: 10
