# Batch Experiment: Run all 4 availability traces sequentially
# Equivalent to oort_n300_oracular_1feb_all4unavail.sh

experiments:
  - name: oort_n300_alpha0.1_syn0
    description: "Oort with 300 trainers, alpha=0.1, synthetic 0% unavailability"
    
    trainer:
      num_trainers: 300
      dataset:
        dirichlet_alpha: 0.1
      availability:
        mode: syn_0
    
    aggregator:
      config_template: expt_scripts_2026/configs/oort_n300_oracular_9may25_syn0.json
      selector: oort
      tracking_mode: oracular
      agg_goal: 10
    
    execution:
      num_gpus: 8
      sleep_between_spawns: 5.0
      aggregator_warmup_time: 600
  
