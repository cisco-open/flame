# Base trainer configuration template
# Common properties shared across all trainers
# Trainer-specific values will be injected at runtime

backend: mqtt

brokers:
  - host: localhost
    sort: mqtt
  - host: localhost:10104
    sort: p2p

groupAssociation:
  param-channel: default

channels:
  - description: Model update is sent from trainer to aggregator and vice-versa
    groupBy:
      type: tag
      value:
        - default
    name: param-channel
    pair:
      - trainer
      - aggregator
    funcTags:
      aggregator:
        - distribute
        - aggregate
      trainer:
        - fetch
        - upload

dataset: https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz

dependencies:
  - numpy >= 1.2.0

hyperparameters:
  batchSize: 32
  learningRate: 0.04
  lrDecayEnabled: false  # Disable by default, enable for REFL experiments
  lrDecayFactor: 0.98  # REFL default
  lrDecayEpoch: 10  # Apply decay every N rounds (REFL default)
  minLearningRate: 0.0001  # Minimum LR floor
  rounds: 5
  # trainer_indices_list: injected at runtime from metadata
  epochs: 1
  use_oort_loss_fn: "True"
  training_delay_enabled: "True"
  # training_delay_s: injected at runtime from trainer registry
  # avl_events_*: injected at runtime from availability traces
  client_notify:
    enabled: "False"
    trace: syn_0
  wait_until_next_avl: "True"
  # Stream data in over time instead of exposing the full partition at
  # init. Disabled by default; override per experiment under
  # trainer.config_overrides.hyperparameters.data_streaming.
  data_streaming:
    enabled: "False"
    full_data_available_after_s: 0  # sim seconds until 100% data is visible

baseModel:
  name: ""
  version: 1

job:
  id: "622a358619ab59012eabeefb"
  name: cifar-10

registry:
  sort: dummy
  uri: ""

selector:
  sort: fedbuff
  kwargs:
    c: 20
    aggGoal: 1

optimizer:
  sort: fedavg
  kwargs: {}

maxRunTime: 300

realm: default/us
role: trainer
