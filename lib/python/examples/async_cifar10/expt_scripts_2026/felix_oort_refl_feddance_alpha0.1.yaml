        batchSize: 10
        learningRate: 0.01
        lrDecayEnabled: true
        lrDecayFactor: 0.98
        lrDecayEpoch: 10
        minLearningRate: 0.0001
      config_overrides:
        hyperparameters:
          data_streaming: {enabled: "True", full_data_available_after_s: 10800}
          util_counterfactual: {enabled: "True", every_n_rounds: 10, sample_size: 256}
    aggregator:
      config_template: ../_metadata/aggregator_base.json
