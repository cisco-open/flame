          batchSize: 10
          learningRate: 0.01
          rounds: 1000
          max_experiment_runtime_s: 12600  # 3.5h wall-clock cap (data fully unlocks at 3h)
          aggGoal: 10
          checkpoint: {enabled: "True", every_n_rounds: 10}
          trackTrainerAvail: {trace: syn_0}
        selector: {kwargs: {aggr_num: 10}}
    execution: *exec

  - name: oort_n300_alpha0.1_syn0_ctrl
