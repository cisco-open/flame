# PHASE 1 (STREAMING, SIMULATED time_mode) - NODE 1 of 2: felix + oort. Concurrent with STREAMING_node2.
experiments:
- name: felix_n300_alpha0.1_syn0_stream_sim
  description: Felix (async_oort + fedbuff) WITH data streaming.
  baseline: felix
  trainer:
    num_trainers: 300
    start_id: 1
    dataset:
      name: cifar10
      dirichlet_alpha: 0.1
    availability:
      mode: syn_0
    enable_training_delays: true
    time_mode: simulated
    hyperparameters:
      batchSize: 10
      learningRate: 0.01
    config_overrides:
      hyperparameters:
        data_streaming:
          enabled: 'True'
          full_data_available_after_s: 10800
        util_counterfactual:
          enabled: 'True'
          every_n_rounds: 10
          sample_size: 256
  aggregator:
    config_template: ../_metadata/aggregator_base.json
    selector: async_oort
    tracking_mode: client_notify
    agg_goal: 10
    log_to_wandb: false
    config_overrides:
      job:
        id: felix_n300_alpha0.1_syn0_stream_sim
      hyperparameters:
        batchSize: 10
        learningRate: 0.01
        rounds: 1000
        max_runtime_s: 12600
        min_trainers_to_start: 290
        min_trainers_join_timeout_s: 600
        aggGoal: 10
        evalEveryNRounds: 10
        checkpoint:
          enabled: 'True'
          every_n_rounds: 10
      selector:
        kwargs:
          c: 30
          aggGoal: 10
  execution: &id001
    num_gpus: 8
    sleep_between_spawns: 1.0
    aggregator_warmup_time: 60
    monitoring:
      enabled: true
      check_interval_seconds: 30
      ram_warning_percent: 80.0
      ram_critical_percent: 90.0
      gpu_warning_percent: 80.0
      gpu_critical_percent: 90.0
- name: oort_n300_alpha0.1_syn0_stream_sim
  description: OORT (sync oort + fedavg, oracular) WITH data streaming.
  baseline: oort
  trainer:
    num_trainers: 300
    start_id: 1
    dataset:
      name: cifar10
      dirichlet_alpha: 0.1
    availability:
      mode: syn_0
    enable_training_delays: true
    time_mode: simulated
    hyperparameters:
      batchSize: 10
      learningRate: 0.01
      lrDecayEnabled: true
      lrDecayFactor: 0.98
      lrDecayEpoch: 10
      minLearningRate: 0.0001
    config_overrides:
      hyperparameters:
        data_streaming:
          enabled: 'True'
          full_data_available_after_s: 10800
        util_counterfactual:
          enabled: 'True'
          every_n_rounds: 10
          sample_size: 256
  aggregator:
    config_template: ../_metadata/aggregator_base.json
    selector: oort
    tracking_mode: oracular
    agg_goal: 10
    log_to_wandb: false
    config_overrides:
      job:
        id: oort_n300_alpha0.1_syn0_stream_sim
      hyperparameters:
        batchSize: 10
        learningRate: 0.01
        rounds: 1000
        max_runtime_s: 12600
        min_trainers_to_start: 290
        min_trainers_join_timeout_s: 600
        aggGoal: 10
        checkpoint:
          enabled: 'True'
          every_n_rounds: 10
        trackTrainerAvail:
          trace: syn_0
      selector:
        kwargs:
          aggr_num: 10
  execution: *id001
