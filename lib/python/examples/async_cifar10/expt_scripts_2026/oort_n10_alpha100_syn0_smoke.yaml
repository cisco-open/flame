# Oort sync smoke test: 10 trainers, homogeneous (alpha=100), oracular tracking.
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/async_cifar10/expt_scripts_2026/oort_n10_alpha100_syn0_smoke.yaml

experiments:
  - name: oort_n10_alpha100_syn0_smoke
    description: "Oort sync smoke (10 trainers, alpha=100, syn_0, oracular)."

    baseline: oort

    trainer:
      num_trainers: 10
      start_id: 1
      dataset:
        name: cifar10
        dirichlet_alpha: 100.0
      availability:
        mode: syn_0
      enable_training_delays: true
      hyperparameters:
        batchSize: 32
        learningRate: 0.001

    aggregator:
      config_template: ../_metadata/aggregator_base.json
      selector: oort
      tracking_mode: oracular
      agg_goal: 5
      log_to_wandb: false
      config_overrides:
        job:
          id: oort_n10_alpha100_syn0_smoke
        hyperparameters:
          batchSize: 32
          learningRate: 0.001
          rounds: 200
          aggGoal: 5
          trackTrainerAvail:
            trace: syn_0
        selector:
          kwargs:
            aggr_num: 5

    execution:
      num_gpus: 2
      sleep_between_spawns: 1.0
      aggregator_warmup_time: 15
      monitoring:
        enabled: false
