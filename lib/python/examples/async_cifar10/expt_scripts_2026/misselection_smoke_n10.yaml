# Mis-selection pipeline SMOKE: validates the new checkpoint + oracle + plot
# machinery end-to-end on a tiny run (10 trainers, 2 GPUs, short rounds).
# One async arm (felix) and one sync arm (oort) so both checkpoint code paths
# are exercised. alpha=0.1 + streaming so visible < total early.
#
# Run:
#   python -m flame.launch.run_experiment \
#     lib/python/examples/async_cifar10/expt_scripts_2026/misselection_smoke_n10.yaml
# Then per run dir:
#   python scripts/analysis/oracle_misselection.py --run-dir <run_dir>
#   python scripts/analysis/analyze_run.py <run_dir>/telemetry

experiments:
  - name: felix_misselection_smoke_n10
    description: "Felix smoke with checkpoints + streaming + util counterfactual."
    baseline: felix
    trainer:
      num_trainers: 10
      start_id: 1
      dataset: {name: cifar10, dirichlet_alpha: 0.1}
      availability: {mode: syn_0}
      enable_training_delays: true
      time_mode: simulated
      hyperparameters: {batchSize: 10, learningRate: 0.01}
      config_overrides:
        hyperparameters:
          client_notify: {trace: syn_0}
          data_streaming: {enabled: "True", full_data_available_after_s: 600}
          util_counterfactual: {enabled: "True", every_n_rounds: 1, sample_size: 128}
    aggregator:
      config_template: ../_metadata/aggregator_base.json
      selector: async_oort
      tracking_mode: client_notify
      agg_goal: 5
      log_to_wandb: false
      config_overrides:
        job: {id: felix_misselection_smoke_n10}
        hyperparameters:
          batchSize: 10
          learningRate: 0.01
          rounds: 30
          aggGoal: 5
          evalEveryNRounds: 5
          checkpoint: {enabled: "True", every_n_rounds: 5}
        selector: {kwargs: {c: 8, aggGoal: 5}}
    execution: &exec
      num_gpus: 2
      sleep_between_spawns: 1.0
      aggregator_warmup_time: 15
      monitoring: {enabled: false}

  - name: oort_misselection_smoke_n10
    description: "OORT sync smoke with checkpoints + streaming + util counterfactual."
    baseline: oort
    trainer:
      num_trainers: 10
      start_id: 1
      dataset: {name: cifar10, dirichlet_alpha: 0.1}
      availability: {mode: syn_0}
      enable_training_delays: true
      time_mode: simulated
      hyperparameters: {batchSize: 10, learningRate: 0.01}
      config_overrides:
        hyperparameters:
          data_streaming: {enabled: "True", full_data_available_after_s: 600}
          util_counterfactual: {enabled: "True", every_n_rounds: 1, sample_size: 128}
    aggregator:
      config_template: ../_metadata/aggregator_base.json
      selector: oort
      tracking_mode: oracular
      agg_goal: 5
      log_to_wandb: false
      config_overrides:
        job: {id: oort_misselection_smoke_n10}
        hyperparameters:
          batchSize: 10
          learningRate: 0.01
          rounds: 30
          aggGoal: 5
          checkpoint: {enabled: "True", every_n_rounds: 5}
          trackTrainerAvail: {trace: syn_0}
        selector: {kwargs: {aggr_num: 5}}
    execution: *exec
