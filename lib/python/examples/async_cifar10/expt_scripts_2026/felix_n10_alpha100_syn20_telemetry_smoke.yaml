# Felix TELEMETRY smoke test: 10 trainers, homogeneous (alpha=100), syn_20.
# Same as felix_n10_alpha100_syn20_smoke.yaml but additionally enables:
#   - data_streaming  : reveal samples over sim time (so visible < total early)
#   - util_counterfactual : emit streamed-prefix vs full-pool statistical utility
# so the post-run analyzer produces the streamed-vs-full disparity plots in
# addition to the standard selector/aggregator/trainer telemetry plots.
#
# Telemetry itself is auto-enabled by the launcher for ANY run; these two
# trainer settings only drive the extra disparity plot.
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/async_cifar10/expt_scripts_2026/felix_n10_alpha100_syn20_telemetry_smoke.yaml

experiments:
  - name: felix_n10_alpha100_syn20_telemetry_smoke
    description: "Felix telemetry smoke (10 trainers, alpha=100, syn_20) with data streaming + utility counterfactual."

    baseline: felix

    trainer:
      num_trainers: 10
      start_id: 1
      dataset:
        name: cifar10
        dirichlet_alpha: 100.0
      availability:
        mode: syn_20
      enable_training_delays: true
      # simulated mode: no sleeps; the aggregator orders updates by a virtual
      # clock fed by trainer-reported completion times. Availability + streaming
      # are evaluated in sim-seconds against that clock (no speedup_factor).
      time_mode: simulated
      hyperparameters:
        batchSize: 32
        learningRate: 0.001
      config_overrides:
        hyperparameters:
          client_notify:
            trace: syn_20
          # Reveal data gradually over the first 600 SIM-seconds so the
          # streamed-vs-full disparity is observable across the run. (Most runs
          # use the 24h default = 86400 sim-s; this is the smoke-scaled value.)
          data_streaming:
            enabled: "True"
            full_data_available_after_s: 600
          # Emit streamed-vs-full statistical-utility disparity telemetry.
          # Default-style: subsample (256) every round; gated on here.
          util_counterfactual:
            enabled: "True"
            every_n_rounds: 1
            sample_size: 256

    aggregator:
      config_template: ../_metadata/aggregator_base.json
      selector: async_oort
      tracking_mode: client_notify
      agg_goal: 5
      log_to_wandb: false
      config_overrides:
        job:
          id: felix_n10_alpha100_syn20_telemetry_smoke
        hyperparameters:
          batchSize: 32
          learningRate: 0.001
          rounds: 200
          aggGoal: 5
        selector:
          kwargs:
            c: 8
            aggGoal: 5

    execution:
      num_gpus: 2
      sleep_between_spawns: 1.0
      aggregator_warmup_time: 15
      monitoring:
        enabled: false
