# REFL sync smoke test: 10 trainers, homogeneous (alpha=100), oracular tracking.
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/async_cifar10/expt_scripts_2026/refl_n10_alpha100_syn0_smoke.yaml

experiments:
  - name: refl_n10_alpha100_syn0_smoke
    description: "REFL sync smoke (10 trainers, alpha=100, syn_0, oracular)."

    baseline: refl

    trainer:
      num_trainers: 10
      start_id: 1
      dataset:
        name: cifar10
        dirichlet_alpha: 100.0
      availability:
        mode: syn_0
      enable_training_delays: true
      hyperparameters:
        batchSize: 32
        learningRate: 0.001

    aggregator:
      config_template: ../_metadata/aggregator_base.json
      selector: refl_oort
      tracking_mode: oracular
      agg_goal: 5
      log_to_wandb: false
      config_overrides:
        job:
          id: refl_n10_alpha100_syn0_smoke
        hyperparameters:
          batchSize: 32
          learningRate: 0.001
          rounds: 200
          trackTrainerAvail:
            trace: syn_0
        # aggr_num (refl_oort's name for the selection/aggregation count) is
        # set once via the top-level `agg_goal: 5` above -- the runner fans
        # it into hyperparameters.aggGoal and selector.kwargs.aggr_num
        # together, so don't duplicate it here.

    execution:
      num_gpus: 2
      sleep_between_spawns: 1.0
      aggregator_warmup_time: 15
      monitoring:
        enabled: false
