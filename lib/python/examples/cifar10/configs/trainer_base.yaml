# cifar10 (sync FL) trainer base template
# Trainer-specific values (taskid, indices, training_delay_s) injected at runtime.

backend: mqtt

brokers:
  - host: localhost
    sort: mqtt
  - host: localhost:10104
    sort: p2p

groupAssociation:
  param-channel: default

channels:
  - description: Model update is sent from trainer to aggregator and vice-versa
    groupBy:
      type: tag
      value:
        - default
    name: param-channel
    pair:
      - trainer
      - aggregator
    funcTags:
      aggregator:
        - distribute
        - aggregate
      trainer:
        - fetch
        - upload

dataset: https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz

dependencies:
  - numpy >= 1.2.0

hyperparameters:
  batchSize: 32
  learningRate: 0.01
  rounds: 100
  epochs: 1

baseModel:
  name: ""
  version: 1

job:
  id: "cifar10-sync"
  name: cifar-10

registry:
  sort: dummy
  uri: ""

selector:
  sort: default
  kwargs: {}

optimizer:
  sort: fedavg
  kwargs: {}

maxRunTime: 300
realm: default/us
role: trainer
