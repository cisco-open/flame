# FedDance CIFAR-10 smoke test: 10 trainers, always-on, FedDance selector.
# Run: python -m flame.launch.run_experiment lib/python/examples/feddance_cifar10/experiments/configs/smoke_10trainer.yaml

experiments:
  - name: feddance_cifar10_smoke_10
    description: "FedDance smoke test, 10 trainers, syn_0 trace"

    metadata:
      dir: examples/_metadata

    trainer:
      num_trainers: 10
      start_id: 1
      dataset:
        name: cifar10
        dirichlet_alpha: 0.1
      availability:
        mode: syn_0
      enable_training_delays: false
      hyperparameters:
        batchSize: 10
        learningRate: 0.01

    aggregator:
      config_template: aggregator/config.json
      selector: feddance
      tracking_mode: oracular
      agg_goal: 5
      log_to_wandb: false

    execution:
      num_gpus: 1
      sleep_between_spawns: 0.5
      aggregator_warmup_time: 10
      monitoring:
        enabled: false
