  dataset_split_file: lib/python/examples/_metadata/dataset_splits/cifar10_alpha0.1_n300.yaml
  template:
    taskid: __TASKID__
    backend: mqtt
    brokers:
    - host: localhost
      sort: mqtt
    - host: localhost:10104
      sort: p2p
    groupAssociation:
      param-channel: default
    channels:
    - description: Model update is sent from trainer to aggregator and vice-versa
      groupBy:
        type: tag
        value:
        - default
      name: param-channel
      pair:
      - trainer
      - aggregator
      funcTags:
        aggregator:
        - distribute
        - aggregate
        trainer:
        - fetch
        - upload
    dataset: https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz
    dependencies:
    - numpy >= 1.2.0
    hyperparameters:
      batchSize: 32
      learningRate: 0.04
